<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WorldDial app icon</title>
  <desc id="desc">A day and night world dial with a moving date sector and a home-location marker.</desc>
  <defs>
    <clipPath id="dial-clip">
      <circle cx="512" cy="464" r="340"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#071b31"/>

  <!-- The date sector projects beyond the dial, as it does in WorldDial. -->
  <path d="M512 464 L134 794 A514 514 0 0 0 318 918 Z" fill="#8292bd" fill-opacity=".23"/>
  <path d="M512 464 L134 794" fill="none" stroke="#c6d5eb" stroke-width="7" stroke-linecap="round" stroke-opacity=".72"/>

  <g clip-path="url(#dial-clip)">
    <!-- A full daylight disk sits behind the moving night surface. -->
    <circle cx="512" cy="464" r="340" fill="#b7cede"/>

    <!-- The locally tugged seam is WorldDial's signature day/night transition. -->
    <path d="M172 468
             C286 482 382 478 446 454
             C482 440 514 430 552 438
             C636 456 724 478 852 468
             L852 804 L172 804 Z"
          fill="#080a21"/>

    <!-- The moving date sector remains visible within the dial without becoming a pie chart. -->
    <path d="M512 464 L134 794 A514 514 0 0 0 318 918 Z" fill="#8292bd" fill-opacity=".17"/>
    <path d="M512 464 L134 794" fill="none" stroke="#d4def0" stroke-width="6" stroke-linecap="round" stroke-opacity=".78"/>
  </g>

  <circle cx="512" cy="464" r="340" fill="none" stroke="#16344a" stroke-width="8"/>

  <!-- Current location: cream core, deep keyline and a quiet outer halo. -->
  <circle cx="748" cy="708" r="45" fill="#fff3cf"/>
  <circle cx="748" cy="708" r="33" fill="#16344a"/>
  <circle cx="748" cy="708" r="23" fill="#fff3cf"/>
</svg>
